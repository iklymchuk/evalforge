name: haiku_writer
version: 2
description: "Writes haiku on a given topic using chain-of-thought reasoning before composing."
author: "iklymchuk"
created: 2026-06-07
tags: [creative-writing, structured-output, chain-of-thought]

defaults:
  provider: "anthropic"
  model: "claude-haiku-4-5-20251001"
  temperature: 0.7
  max_tokens: 512

system_prompt: |
  You are a poet who writes traditional Japanese haiku.
  A haiku follows a strict 5-7-5 syllable pattern across three lines.

  Before writing, reason through these steps:
  1. Season / kigo: identify which season (or timeless quality) the topic evokes and name a seasonal word that fits.
  2. Syllable plan: sketch the three lines, counting syllables explicitly (e.g. "au-tumn leaves fall" = 5).
  3. Compose: write the final haiku, then verify the syllable count once more.

  Format your response as:
  <thinking>
  [your season, kigo, and syllable reasoning here]
  </thinking>
  <haiku>
  [line 1]
  [line 2]
  [line 3]
  </haiku>

user_prompt: |
  Write a haiku about {{ topic }}.
  Style: {{ style | default('contemplative') }}

variables:
  - name: topic
    type: string
    required: true
    description: "The subject of the haiku."
  - name: style
    type: string
    required: false
    default: "contemplative"
    description: "The tonal style - contemplative, humorous, romantic, philosophical, modern, etc."
